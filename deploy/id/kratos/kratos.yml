# Ory Kratos config. DSN, secrets and SMTP come from environment variables (see compose.yaml).
# UI URLs point at your self-service UI (placeholder 127.0.0.1:4455). Change them to match.

serve:
  public:
    base_url: http://127.0.0.1:4433/
    cors:
      enabled: true
      allowed_origins:
        - http://127.0.0.1:4455
      allow_credentials: true
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:4455/
  allowed_return_urls:
    - http://127.0.0.1:4455

  methods:
    password:
      enabled: true
    code:
      enabled: true
    totp:
      enabled: true
      config:
        issuer: Clinical IdP
    lookup_secret:
      enabled: true

  flows:
    error:
      ui_url: http://127.0.0.1:4455/error

    login:
      ui_url: http://127.0.0.1:4455/login
      lifespan: 10m

    registration:
      ui_url: http://127.0.0.1:4455/registration
      lifespan: 10m
      after:
        password:
          hooks:
            - hook: session

    settings:
      ui_url: http://127.0.0.1:4455/settings
      privileged_session_max_age: 15m
      required_aal: highest_available

    recovery:
      enabled: true
      ui_url: http://127.0.0.1:4455/recovery
      use: code

    verification:
      enabled: true
      ui_url: http://127.0.0.1:4455/verification
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:4455/

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:4455/login

session:
  lifespan: 8h
  whoami:
    required_aal: highest_available

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

ciphers:
  algorithm: xchacha20-poly1305

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

courier:
  smtp:
    from_address: no-reply@idp.local
    from_name: Clinical IdP

# Makes Kratos the login/consent provider for Hydra: Kratos login flows accept
# Hydra's login_challenge and accept the request on Hydra's admin API.
oauth2_provider:
  url: http://hydra:4445

log:
  level: info
  format: text
  leak_sensitive_values: false
