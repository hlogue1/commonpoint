#
# tern config for migrations/terminology:
#   go tool tern migrate -m migrations/terminology -c deploy/db/tern-terms.conf
#
# The version table is explicit so it never depends on search_path (T6). It is the table
# 001-015 were applied with; moving the schema to `terms` (review P5) is a separate migration.
# Run deploy/db/terms-bootstrap.sql once per cluster first.
[database]
host = localhost
port = 5433
database = commonpoint
user = cp_terms_migrations
password = {{env "CP_TERMS_MIGRATION_PASSWD"}}
version_table = public.schema_version
