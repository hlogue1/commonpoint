version: v2
modules:
  - path: api/proto
lint:
  use:
    - STANDARD
  # Resource-oriented API (AIP style): RPCs return and reuse resource messages
  # (Job, CodeSystemVersion, VersionRef, ValueSetDefinition) instead of per-RPC wrappers.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
