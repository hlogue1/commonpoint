  #   out: clients/rust/src/gen
  # - remote: buf.build/community/neoeinstein-tonic
  #   out: clients/rust/src/gen
  # - remote: buf.build/apple/swift                   # Flex
  #   out: clients/swift/Sources/Gen
  # - remote: buf.build/grpc/swift
  #   out: clients/swift/Sources/Gen
