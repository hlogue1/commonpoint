version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/hlogue1/commonpoint/api/gen/go
plugins:
  - remote: buf.build/protocolbuffers/go
    out: api/gen/go
    opt: paths=source_relative
  # Pick ONE server stack in Phase 0 (see ROADMAP D1):
  - remote: buf.build/connectrpc/go
    out: api/gen/go
    opt: paths=source_relative
  # - remote: buf.build/grpc/go
  #   out: api/gen/go
  #   opt: paths=source_relative
  # Client targets, enable when needed (Phase 10):
